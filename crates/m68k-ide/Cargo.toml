[package]
name = "m68k-ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Motorola 68000 (m68k) Studio IDE Desktop Application"
license.workspace = true
repository.workspace = true

[dependencies]
m68k-core = { path = "../m68k-core" }
m68k-asm = { path = "../m68k-asm" }
m68k-disasm = { path = "../m68k-disasm" }
m68k-floppy = { path = "../m68k-floppy" }
m68k-lsp = { path = "../m68k-lsp" }

axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-std"] }
open = "5.3"

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
tower-lsp = "0.20"
base64 = "0.22"
