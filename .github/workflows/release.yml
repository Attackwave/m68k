name: Build and Publish Release Assets

on:
  push:
    tags:
      - 'v*'
    # A merged pull request titled `Release X.Y.Z` releases on its own; the
    # tag is created with the release. Pushing the tag by hand still works.
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the version
        id: pick
        env:
          # Through the environment, never interpolated into the script: a
          # commit message is text, not shell.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            title=$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)
            version=$(printf '%s\n' "$title" | sed -nE 's/^Release ([0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$/\1/p')
            if [ -z "$version" ]; then
              echo "not a release commit: $title"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "v$version is already tagged, nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # The binaries report the workspace version; a release whose tag
          # disagrees with it is stopped here, before anyone is asked to
          # approve it.
          manifest=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          if [ "$manifest" != "$version" ]; then
            echo "Cargo.toml says $manifest, release is $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  approve:
    name: Approve release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Release approved for v${{ needs.version.outputs.version }}"

  build:
    needs: [version, approve]
    strategy:
      # A broken archive on one platform should not hide whether the others
      # built, so all three always run to completion.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: '.exe'
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ''
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke-test the binaries
        shell: bash
        # Catches an archive full of binaries that cannot run at all — a
        # broken build, a missing runtime, a wrong-architecture cross-build.
        # Assembling and disassembling through a pipe exercises both tools
        # and the stdin/stdout paths in one go.
        run: |
          set -eu
          bindir="target/${{ matrix.target }}/release"
          printf '\tmoveq\t#0,d0\n\trts\n' > smoke.s
          "$bindir/m68k-asm${{ matrix.suffix }}" smoke.s -o smoke.bin
          # 7000 4e75 = MOVEQ #0,D0 / RTS
          actual=$(od -An -tx1 -v smoke.bin | tr -d ' \n')
          if [ "$actual" != "70004e75" ]; then
            echo "unexpected assembler output: $actual" >&2
            exit 1
          fi
          "$bindir/m68k-disasm${{ matrix.suffix }}" smoke.bin | grep -qi 'moveq'
          "$bindir/m68k-floppy${{ matrix.suffix }}" --help > /dev/null
          # The built binaries must report the version being released.
          version="${{ needs.version.outputs.version }}"
          for tool in m68k-asm m68k-disasm m68k-floppy; do
            reported=$("$bindir/$tool${{ matrix.suffix }}" --version)
            if [ "$reported" != "$tool $version" ]; then
              echo "$tool reports '$reported', release is $version" >&2
              exit 1
            fi
          done
          echo "smoke test passed for ${{ matrix.target }}"

      - name: Package archive
        shell: bash
        run: |
          set -eu
          staging="m68k-v${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$staging"
          for bin in m68k-asm m68k-disasm m68k-floppy; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.suffix }}" "$staging/"
          done
          # Ship the licence and readme alongside the binaries — an archive
          # of bare executables says nothing about its own terms. No `|| true`
          # here: if either file goes missing the release should fail loudly.
          cp README.md LICENSE "$staging/"

          # Strip on the platforms where it is reliable. Windows MSVC keeps
          # its debug info in a separate .pdb that is not shipped, so there
          # is nothing to strip there.
          if [ "${{ runner.os }}" = "Linux" ]; then
            strip "$staging"/m68k-asm "$staging"/m68k-disasm "$staging"/m68k-floppy
          elif [ "${{ runner.os }}" = "macOS" ]; then
            strip -x "$staging"/m68k-asm "$staging"/m68k-disasm "$staging"/m68k-floppy
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${staging}.zip" "$staging" > /dev/null
            asset="${staging}.zip"
          else
            tar czf "${staging}.tar.gz" "$staging"
            asset="${staging}.tar.gz"
          fi
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1

  publish:
    # Everything is published from one job so the release either has the
    # complete set of assets or fails visibly — previously each platform
    # uploaded on its own, and a mid-matrix failure left a half-populated
    # release behind with no single place to see it.
    needs: [version, build]
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          # One combined file rather than a .sha256 beside each archive:
          # same information, and `sha256sum -c SHA256SUMS` checks whatever
          # the user downloaded in a single pass.
          #
          # No source archive is built here. The source is the same for every
          # platform — the target is a compile-time switch — and GitHub
          # already attaches "Source code (zip/tar.gz)" to every release.
          # Exclude SHA256SUMS explicitly so a re-run cannot checksum it.
          sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS
          echo "--- release assets ---"
          ls -la
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Verify checksums
        # Reads back what was just written, so a corrupted upload candidate
        # fails here rather than being discovered by whoever downloads it.
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Creates the tag on this commit when it does not exist yet (a
          # release from main); a hand-pushed tag is reused as is.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
