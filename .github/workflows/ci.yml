name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform failing should still report the others, so a
      # Windows-only path bug is distinguishable from a real regression.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Lints and release artifacts only need to run once. Linux is the
          # primary target and the one the release binaries are cut from.
          - os: ubuntu-latest
            primary: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        if: matrix.primary
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.primary
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --all --verbose

      - name: Build release
        if: matrix.primary
        run: cargo build --release

      - name: Upload binaries
        if: matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: m68k-binaries
          path: |
            target/release/m68k-asm
            target/release/m68k-disasm
            target/release/m68k-floppy
            target/release/m68k-lsp
            target/release/m68k-ide

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pinned to the declared rust-version in the workspace manifest. If
      # this job fails, either the code started using a newer feature (bump
      # rust-version) or the pin drifted — do not "fix" it by widening here.
      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Check against the declared MSRV
        run: cargo check --all-targets --verbose

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory database changes independently of this repo, so a new
    # advisory must not turn every unrelated PR red. Reported, not enforced.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz smoke run (60s per target)
        # Not a full fuzzing campaign — just enough per-PR signal to catch
        # an obviously broken target or an immediately-reachable panic,
        # the same class of bug that a 60s local run already found twice
        # while setting this up (a UTF-8 char-boundary panic in
        # tokens.rs, an OOM from an unbounded allocation in
        # amiga_hunk.rs's Reader::bytes; a 4 GB allocation and two
        # unbounded pointer chains in amigados.rs). ASAN_OPTIONS=symbolize=0 avoids
        # a slow/blocking external symbolizer call on every newly
        # discovered coverage edge.
        env:
          ASAN_OPTIONS: symbolize=0
        run: |
          for target in disassemble amiga_hunk_parse assembler_pipeline floppy_adf floppy_uae floppy_ipf floppy_amigados; do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" -- -max_total_time=60 -timeout=10
            echo "::endgroup::"
          done
