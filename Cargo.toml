[workspace]
members = [
    "crates/m68k-core",
    "crates/m68k-asm",
    "crates/m68k-disasm",
    "crates/m68k-floppy",
    "crates/m68k-cli",
    "crates/m68k-lsp",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "2.2.0"
edition = "2024"
# Minimum supported Rust version. Determined empirically, not guessed:
# 1.87 fails with E0658 on the let-chains in m68k-core (`let` expressions
# in this position are unstable), 1.88 stabilized them and builds clean.
# Verified against 1.88.0 (lower bound) through 1.97.1 (current stable).
rust-version = "1.88"
authors = ["Attackwave"]
description = "Motorola 68000 (m68k) family assembler and disassembler"
license = "MIT"
repository = "https://github.com/Attackwave/m68k"

[workspace.dependencies]
thiserror = "2.0"
bitflags = "2.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
